<!DOCTYPE html>
<html lang="it"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>HEXBEAT</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@900&display=swap" rel="stylesheet">
<style>html,body{margin:0;height:100%;background:#000;overflow:hidden;touch-action:none}canvas{display:block;width:100%;height:100%}</style></head>
<body><canvas id="c"></canvas>
<script>
// ===== CONFIG: colori, canzoni, velocità. Modifica qui. =====
const TAU=Math.PI*2,SIDE=TAU/6,K=1.1547,RP=.19,HUB=.12,TH=.1,PW=.035;
const hsl=(h,s,l)=>`hsl(${h},${s}%,${l}%)`;
const LEVELS=[
 {name:'VERDE · GIALLO · ROSSO',file:'105.mp3',offset:0,speed:1,seed:105,
  pal:(tt)=>{let p=(tt/30)%2;p=p>1?2-p:p;const h=Math.round(120*(1-p));
   return{b1:hsl(h,62,64),b2:hsl(h,62,57),w:hsl(h,70,22),p:hsl(h,40,96)}}},
 {name:'CREMISI · NERO',file:'100.mp3',offset:39,speed:1.1,seed:100,inv:true,
  pal:(tt,inv)=>inv?{b1:'#0b0308',b2:'#170610',w:'#7d0e24',p:'#f4bcc4'}:{b1:'#6f0c1f',b2:'#5b0819',w:'#07020a',p:'#f4bcc4'}}
];
// ===== ANALISI MUSICALE =====
const mul=a=>()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296};
const cd=(a,b)=>{const m=((a-b)%6+6)%6;return Math.min(m,6-m)};
const PAT={
 wall:(g,d,r)=>[[0,[g]],[2,[g+(r()*3|0)-1]]],
 zig:(g,d)=>[0,1,2,3].map(i=>[i,[g+(i%2)*d]]),
 stair:(g,d)=>[0,1,2,3].map(i=>[i,[g+i*d]]),
 alt3:(g)=>[0,1,2,3].map(i=>[i,[g+i%2,g+i%2+2,g+i%2+4]]),
 pairs:(g,d)=>[0,1,2,3].map(i=>[i,[g+(i%2)*d,g+3+(i%2)*d]]),
 burst:(g,d)=>[[0,[g]],[.5,[g]],[1,[g]],[1.5,[g]],[3,[g+2*d]]]
};
function analyze(buf,L){
 const sr=buf.sampleRate,x=buf.getChannelData(0),hop=512,fps=sr/hop,n=Math.floor(x.length/hop),t0=L.offset;
 const env=new Float32Array(n);let lp=0;
 for(let i=0;i<n;i++){let lo=0,hi=0;for(let j=i*hop,e=j+hop;j<e;j++){lp+=(x[j]-lp)*.02;lo+=lp*lp;const d=x[j]-(x[j-1]||0);hi+=d*d}
  env[i]=Math.log1p(60*Math.sqrt(lo/hop))+.7*Math.log1p(60*Math.sqrt(hi/hop))}
 const o=new Float32Array(n);
 for(let i=8;i<n;i++){let m=0;for(let k=1;k<=8;k++)m+=env[i-k];o[i]=Math.max(0,env[i]-m/8)}
 const q=o.slice().sort()[Math.floor(n*.97)]||1;for(let i=0;i<n;i++)o[i]=Math.min(1,o[i]/q);
 const f0=Math.floor(t0*fps);let best={s:-1};
 for(let bpm=70;bpm<=190;bpm+=.25){const per=60/bpm*fps;
  for(let ph=0;ph<per;ph++){let s=0,c=0;for(let p=f0+ph;p<n-1;p+=per){const i=p|0,fr=p-i;s+=o[i]*(1-fr)+o[i+1]*fr;c++}
   s=s/c*Math.exp(-.5*Math.pow(Math.log2(bpm/120)/.7,2));if(s>best.s)best={s,bpm,per,ph}}}
 const bd=60/best.bpm,tg0=(f0+best.ph)/fps,dur=buf.duration,rng=mul(L.seed);
 const S=b=>{const p=Math.round(f0+best.ph+b*best.per);let m=0;for(let i=p-2;i<=p+2;i++)m=Math.max(m,o[i]||0);return m};
 const rows=[];
 for(let bar=0;;bar++){const b0=bar*4,tb=tg0+b0*bd;if(tb+4*bd>dur-1.5)break;if(tb<t0+2)continue;
  let it=0;for(let h=0;h<8;h++)it+=S(b0+h/2);it/=8;if(it<.1)continue; // pausa se la musica è calma
  const ramp=Math.min(1,(tb-t0)/90),xx=it*.6+ramp*.4+(rng()-.5)*.3,g=rng()*6|0,d=rng()<.5?1:-1;
  const ty=xx<.3?['wall']:xx<.5?['zig','wall','stair']:xx<.7?['zig','stair','alt3','pairs']:['burst','alt3','pairs','stair','burst'];
  for(const [b,gp] of PAT[ty[rng()*ty.length|0]](g,d,rng))rows.push({t:tb+b*bd,g:gp})}
 let pr=null; // garantisce che ogni passaggio sia raggiungibile dal giocatore
 for(const r of rows){r.g=r.g.map(v=>((v%6)+6)%6);
  if(pr){const al=Math.max(0,Math.floor((r.t-pr.t-TH/L.speed-.05)/.19));let bd2=9,bp=0,bc=0;
   for(const a of pr.g)for(const c of r.g){const dd=cd(a,c);if(dd<bd2){bd2=dd;bp=a;bc=c}}
   if(bd2>al){const sg=((bc-bp+6)%6)<=3?1:-1;r.g.push(((bp+sg*al)%6+6)%6)}}
  r.w=[0,1,2,3,4,5].map(s=>!r.g.includes(s));pr=r}
 return{rows,beatDur:bd,tg0,bpm:best.bpm,dur};
}
// ===== STATO =====
const cv=document.getElementById('c'),ctx=cv.getContext('2d'),DEF={beatDur:.5,tg0:0,rows:[]};
let W,H,U,st='menu',lv=0,AC,src,startAt,BUF={},AN={},phi=0,keys={L:0,R:0},tF=0,msg='',lastP=null;
let best=JSON.parse(localStorage.getItem('hxb')||'{}');
function rs(){const d=devicePixelRatio||1;W=cv.width=innerWidth*d;H=cv.height=innerHeight*d;U=Math.min(W,H)*.46}
addEventListener('resize',rs);rs();
const rotAt=(t,an)=>.35*t+.8*Math.sin(t*TAU/(16*an.beatDur));
const sd=a=>Math.floor((((a%TAU)+TAU)%TAU)/SIDE);
function poly(pts){ctx.beginPath();pts.forEach((p,i)=>i?ctx.lineTo(p[0],p[1]):ctx.moveTo(p[0],p[1]));ctx.closePath()}
const P=(a,m)=>[m*K*Math.cos(a),m*K*Math.sin(a)];
// ===== DISEGNO =====
function scene(L,t,an,walls){
 const tt=Math.max(0,t-L.offset),per=16*an.beatDur;
 const n=L.inv?Math.max(0,Math.floor((t-an.tg0)/per)):0,r=Math.min(1,(t-an.tg0-n*per)/.9);
 let f=(t-an.tg0)/an.beatDur;f-=Math.floor(f);const pulse=Math.exp(-5*f),rot=rotAt(t,an),sc=1+.04*pulse;
 ctx.save();ctx.translate(W/2,H/2);ctx.scale(U*sc,U*sc);
 const draw=inv=>{const p=L.pal(tt,inv);lastP=p;ctx.save();ctx.rotate(rot);
  ctx.fillStyle=p.b1;ctx.fillRect(-9,-9,18,18);ctx.fillStyle=p.b2;
  for(let i=1;i<6;i+=2){const a=i*SIDE;poly([[0,0],[9*Math.cos(a),9*Math.sin(a)],[9*Math.cos(a+SIDE),9*Math.sin(a+SIDE)]]);ctx.fill()}
  if(walls){ctx.fillStyle=p.w;for(const w of an.rows){const m=RP+(w.t-t)*L.speed;if(m>5||m+TH<.1)continue;
   for(let s=0;s<6;s++)if(w.w[s]){const a=s*SIDE,b=a+SIDE;poly([P(a,m),P(b,m),P(b,m+TH),P(a,m+TH)]);ctx.fill()}}}
  poly([0,1,2,3,4,5].map(i=>P(i*SIDE,HUB)));ctx.fillStyle=p.b1;ctx.fill();ctx.lineWidth=.03;ctx.strokeStyle=p.w;ctx.stroke();ctx.restore()};
 if(n>0&&r<1){draw((n-1)&1);ctx.save();ctx.beginPath();ctx.arc(0,0,(1-Math.pow(1-r,3))*4.5,0,TAU);ctx.clip();draw(n&1);ctx.restore()}else draw(n&1);
 if(walls){ctx.rotate(phi);ctx.fillStyle=lastP.p;poly([[RP+.045,0],[RP-.03,.035],[RP-.03,-.035]]);ctx.fill()}
 ctx.restore();
}
function tx(s,x,y,size,col,al='center'){ctx.font=`900 ${size}px Orbitron,'Trebuchet MS',Arial,sans-serif`;ctx.fillStyle=col;ctx.textAlign=al;ctx.textBaseline='middle';ctx.fillText(s,x,y)}
function arrow(x,y,s,dir,col){ctx.fillStyle=col;poly([[x+dir*s,y-s],[x-dir*s,y],[x+dir*s,y+s]]);ctx.fill()}
// ===== CARICAMENTO AUDIO: MusicData/songs/<numero>.mp3 =====
const SONGS='MusicData/songs/';
async function getAudio(L){
 const r=await fetch(SONGS+L.file).catch(()=>null);
 if(!r||!r.ok)throw Error(SONGS+L.file+' non trovato');
 return r.arrayBuffer()}
// ===== AUDIO / FLUSSO =====
async function go(){
 if(st==='load')return;
 try{if(!AC)AC=new AudioContext();await AC.resume();const L=LEVELS[lv];st='load';msg='';
  if(!AN[lv]){BUF[lv]=await AC.decodeAudioData(await getAudio(L));await new Promise(r=>setTimeout(r,60));AN[lv]=analyze(BUF[lv],L)}
  stop();src=AC.createBufferSource();src.buffer=BUF[lv];src.gain=AC.createGain();src.connect(src.gain).connect(AC.destination);
  startAt=AC.currentTime+.2;src.start(startAt,L.offset);phi=0;st='play'
 }catch(e){msg=e.message+' — serve un server (GitHub Pages o python -m http.server)';st='menu'}
}
function stop(){try{src&&src.stop()}catch(e){}src=null}
function die(t,L){st='dead';tF=t;const s=src;if(s){s.gain.gain.setTargetAtTime(0,AC.currentTime,.05);setTimeout(()=>{try{s.stop()}catch(e){}},400)}
 const ts=t-L.offset;if(!(best[lv]>=ts)){best[lv]=ts;localStorage.setItem('hxb',JSON.stringify(best))}}
function collide(t,a,L,an){const s1=sd(a-.07),s2=sd(a+.07);
 for(const r of an.rows){if(Math.abs(r.t-t)>.5)continue;const m=(r.t-t)*L.speed;if(m<PW&&m+TH>-PW&&(r.w[s1]||r.w[s2]))return 1}return 0}
function lvl(d){lv=(lv+d+LEVELS.length)%LEVELS.length}
// ===== INPUT =====
addEventListener('keydown',e=>{const c=e.code;
 if(c==='ArrowLeft'||c==='KeyA'){keys.L=1;if(st==='menu')lvl(-1)}
 if(c==='ArrowRight'||c==='KeyD'){keys.R=1;if(st==='menu')lvl(1)}
 if((c==='Space'||c==='Enter')&&st!=='play'){e.preventDefault();go()}
 if(c==='Escape'){stop();st='menu'}});
addEventListener('keyup',e=>{if(e.code==='ArrowLeft'||e.code==='KeyA')keys.L=0;if(e.code==='ArrowRight'||e.code==='KeyD')keys.R=0});
addEventListener('pointerdown',e=>{const fx=e.clientX/innerWidth;
 if(st==='play'){fx<.5?keys.L=1:keys.R=1}
 else if(st==='menu'){fx<.25?lvl(-1):fx>.75?lvl(1):go()}
 else if(st!=='load'){e.clientY<innerHeight*.15?(stop(),st='menu'):go()}});
addEventListener('pointerup',()=>{keys.L=keys.R=0});
// ===== LOOP =====
let last=performance.now();
function frame(now){
 const dt=Math.min(.05,(now-last)/1e3);last=now;const L=LEVELS[lv];let t=now/1e3,an=DEF;
 const live=st==='play'||st==='dead'||st==='win';
 if(live){an=AN[lv];t=st==='play'?AC.currentTime-startAt+L.offset:tF}
 if(st==='play'){phi+=(keys.R-keys.L)*6.4*dt;
  if(collide(t,phi-rotAt(t,an),L,an))die(t,L);else if(t>=BUF[lv].duration-.05){st='win';tF=t}}
 scene(L,t,an,live);
 const p=lastP,s=U/100;
 if(st==='menu'||st==='load'){
  tx('HEXBEAT',W/2,H*.2,U*.24,p.w);
  tx(L.name,W/2,H*.52,U*.075,p.w);
  arrow(W*.12,H*.52,U*.1,-1,p.w);arrow(W*.88,H*.52,U*.1,1,p.w);
  if(best[lv])tx('MIGLIOR TEMPO '+best[lv].toFixed(2)+'s',W/2,H*.62,U*.045,p.w);
  tx(st==='load'?'ANALIZZO LA MUSICA…':'SPAZIO / TOCCA PER GIOCARE',W/2,H*.8,U*.05,p.w);
  tx('← → SCEGLI IL LIVELLO',W/2,H*.87,U*.035,p.w);
  if(msg)tx(msg,W/2,H*.95,U*.03,p.w)}
 else{tx((t-L.offset).toFixed(2)+'s',W-U*.12,U*.12,U*.07,p.p,'right');
  tx('BPM '+an.bpm.toFixed(1),U*.12,U*.1,U*.035,p.p,'left');
  if(st!=='play'){tx(st==='win'?'COMPLETATO!':'GAME OVER',W/2,H*.4,U*.14,p.p);
   tx('SPAZIO / TOCCA · RIPROVA   ESC · MENU',W/2,H*.62,U*.045,p.p)}}
 requestAnimationFrame(frame)}
requestAnimationFrame(frame);
</script></body></html>

name: HEXBEAT smoke tests

on:
  pull_request:
    branches: [main, gameplay/edge-contact-esc]

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run deterministic smoke tests
        run: node smoke-test.mjs
      - name: Run pattern and Void reachability audit
        run: node pattern-reachability-test.mjs

<div class="hb-settings" id="hexbeat-settings" hidden aria-hidden="true">
  <button class="hb-settings__scrim" type="button" data-settings-close aria-label="Close settings"></button>
  <section class="hb-settings__dialog" role="dialog" aria-modal="true" aria-labelledby="hb-settings-title">
    <header class="hb-settings__header">
      <div>
        <p class="hb-settings__eyebrow">HEXBEAT / SYSTEM</p>
        <h1 id="hb-settings-title">SETTINGS</h1>
        <p class="hb-settings__subline">Tune the experience. Keep the rhythm.</p>
      </div>
      <button class="hb-settings__close" type="button" data-settings-close aria-label="Close settings">×</button>
    </header>
    <div class="hb-settings__body">
      <nav class="hb-settings__nav" data-settings-nav aria-label="Settings categories"></nav>
      <main class="hb-settings__content" data-settings-content></main>
    </div>
    <footer class="hb-settings__footer">
      <p>ESC <span>·</span> CLOSE</p>
      <div class="hb-settings__footer-actions">
        <button class="hb-settings__reset" type="button" data-settings-reset>RESET</button>
        <button class="hb-settings__done" type="button" data-settings-close>DONE</button>
      </div>
    </footer>
  </section>
</div>
